server {
    listen 80;
    server_name agt-gateway.itech.run;
    return 301 https://$host$request_uri;
}

server {
    server_name agt-gateway.itech.run;

    # 允许较大的请求体（如长上下文或图片 base64）
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:5055;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 关键：关闭缓冲以支持 OpenAI SSE 流式输出 (stream: true)
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 延长超时时间，避免长思考/长文本生成被 Nginx 提前断开
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ---- Certbot 的 TLS 部分 ----
    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/live/agt-gateway.itech.run/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agt-gateway.itech.run/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/agt-gateway_access.log;
    error_log  /var/log/nginx/agt-gateway_error.log;
}
