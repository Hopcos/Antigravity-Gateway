version: '3.8'

services:
  antigravity-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: antigravity-gateway
    restart: unless-stopped
    ports:
      - "5055:5055"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # 其余配置（如 GATEWAY_API_KEY、ANTIGRAVITY_REFRESH_TOKEN 等）统一由根目录 .env 文件管理
    # volumes:
      # 可选：若改用文件凭据而非 .env 中的 ANTIGRAVITY_REFRESH_TOKEN，可取消注释挂载
      # - ~/.gemini:/root/.gemini:ro
